[workspace]
members = [
    "crates/dm-plugin-sdk",
    "crates/dm-plugin-support",
    "examples/hello",
    "plugins/db",
    "plugins/ssh",
]
default-members = ["."]
resolver = "3"

[package]
name = "dameng-cli"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "A minimal plugin host for Dameng database tools"
license = "MIT"
repository = "https://github.com/guangl/dameng-cli"
readme = "README.md"
keywords = ["dameng", "database", "cli", "plugins"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "dm"
path = "src/main.rs"

# Every test lives under tests/. Each target is one binary built from a
# main.rs plus sibling modules, so no test file outgrows the 200-line limit.

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[dependencies]
anyhow = "1.0.104"
dm-plugin-support = { path = "crates/dm-plugin-support" }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
# Pinned: 7.2.2 uses let-chains (Rust 1.88+) and breaks the declared 1.85 MSRV.
comfy-table = "=8.0.0"
indicatif = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dm-plugin-sdk = { version = "0.4.1", path = "crates/dm-plugin-sdk" }
semver = "1.0.28"
serde_json = "1.0.151"
sha2 = "0.10.9"
fs2 = "0.4.3"
jiff = "0.2.37"
env_filter = "2.0"

# Keep the published crate declaration while ensuring local workspace plugins
# resolve to the in-tree SDK (which uses DM_PLUGIN_HOME rather than the older
# DM_HOME published in dm-plugin-sdk 0.2.0).
[patch.crates-io]
dm-plugin-sdk = { path = "crates/dm-plugin-sdk" }

