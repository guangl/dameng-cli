[workspace]
members = ["crates/dm-plugin-sdk", "examples/hello"]
default-members = ["."]
resolver = "3"

[package]
name = "dameng-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A minimal plugin host for Dameng database tools"
license = "MIT"
repository = "https://github.com/guangl/dameng-cli"
readme = "README.md"
keywords = ["dameng", "database", "cli", "plugins"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "dm"
path = "src/main.rs"

[[test]]
name = "plugins"
path = "tests/integration/plugins.rs"

[[test]]
name = "self_update"
path = "tests/integration/self_update.rs"

[[test]]
name = "unit"
path = "tests/unit/core.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.5"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dm-plugin-sdk = { version = "0.2.0", path = "crates/dm-plugin-sdk" }
semver = "1.0.28"
serde_json = "1.0.151"
sha2 = "0.10.9"
minisign = "0.9.1"
