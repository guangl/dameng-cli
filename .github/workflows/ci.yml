name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Format, Clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Check the 200-line file limit
        run: sh scripts/check_file_lines.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check the release script
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          RELEASE_TAG="v$version" python3 scripts/release.py verify
          python3 scripts/test_release.py
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - name: Install completion test shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh sshpass openssh-server
      - name: Test encrypted SSH keys against a loopback server
        if: runner.os == 'Linux'
        run: python3 scripts/test_ssh_auth.py
      - name: Test completion adapters in real shells
        if: runner.os == 'macOS'
        run: python3 scripts/test_completions.py
      - name: Test all Unix completion adapters
        if: runner.os == 'Linux'
        run: python3 scripts/test_completions.py --require bash,zsh
  coverage:
    name: Coverage (lines >= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 95
  msrv:
    name: Minimum Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace --all-targets --locked
