name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  PYTHONUTF8: "1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  build:
    needs: checks
    env:
      # Keep Cargo and rustc on the explicitly installed release toolchain.
      RUSTUP_TOOLCHAIN: 1.99.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install GNU Linux linker
        if: contains(matrix.target, '-linux-gnu')
        run: python -m pip install cargo-zigbuild==0.23.4 ziglang==0.15.2
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Configure musl linker
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl) prefix=X86_64 ;;
            aarch64-unknown-linux-musl) prefix=AARCH64 ;;
            *) echo "Unsupported musl target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          echo "CARGO_TARGET_${prefix}_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_${prefix,,}_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      # ARMv7 has no native runner, so the runtime check runs under QEMU.
      - uses: docker/setup-qemu-action@v3
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
      - name: Verify version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py verify
      - name: Build host and bundled plugins
        shell: bash
        run: bash scripts/build_release.sh "${{ matrix.target }}"
      - name: Check GNU Linux glibc requirements and runtime
        if: contains(matrix.target, '-linux-gnu')
        run: |
          python scripts/check_glibc.py "${{ matrix.target }}"
          bash scripts/test_glibc_runtime.sh "${{ matrix.target }}"
      - name: Package binary and license
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py package
      - uses: actions/upload-artifact@v7
        with:
          name: dm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          notes="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$notes" ]]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag "${flags[@]}"
