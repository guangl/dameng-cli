name: Feature request
description: 提议宿主架构或 Rust 插件协议改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与替代方案
      description: 具体数据库业务能力应优先作为独立 Rust 插件实现。
    validations:
      required: true
