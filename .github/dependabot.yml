version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Follow stable rather than replacing it with a numeric release ref.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
