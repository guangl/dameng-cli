version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # This action ref is the declared MSRV, not a dependency to upgrade.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
