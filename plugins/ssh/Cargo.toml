[package]
name = "dm-plugin-ssh"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Manage saved SSH server connections"
license = "MIT"

[lib]
name = "dm_plugin_ssh"
path = "src/lib.rs"

[[bin]]
name = "dm-ssh"
path = "src/main.rs"

[dependencies]
dm-plugin-support = { path = "../../crates/dm-plugin-support" }
aes-gcm = "0.10"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# Pinned: 7.2.2 uses let-chains (Rust 1.88+) and breaks the declared 1.85 MSRV.
comfy-table = "=8.0.0"
dm-plugin-sdk = "0.4.1"
pbkdf2 = "0.12"
rand = "0.8"
rpassword = "7.5.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27"
