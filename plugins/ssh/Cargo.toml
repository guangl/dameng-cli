[package]
name = "dm-plugin-ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage saved SSH server connections"
license = "MIT"

[lib]
name = "dm_plugin_ssh"
path = "src/lib.rs"

[[bin]]
name = "dm-ssh"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dm-plugin-sdk = "0.2.0"
rand = "0.8"
rpassword = "7.5.4"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27"
