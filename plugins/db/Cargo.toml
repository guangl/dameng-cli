[package]
name = "dm-plugin-db"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.0"
description = "Manage saved Dameng database connections"
license = "MIT"

[lib]
name = "dm_plugin_db"
path = "src/lib.rs"

[[bin]]
name = "dm-db"
path = "src/main.rs"

[dependencies]
dm-plugin-support = { path = "../../crates/dm-plugin-support" }
aes-gcm = "0.11"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8.0"
dm-plugin-sdk = "0.4.1"
rand = "0.10"
pbkdf2 = "0.13"
rpassword = "7.5.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27"
