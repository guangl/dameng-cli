[package]
name = "dm-plugin-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage saved Dameng database connections"
license = "MIT"

[lib]
name = "dm_plugin_db"
path = "src/lib.rs"

[[bin]]
name = "dm-db"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# Pinned: 7.2.2 uses let-chains (Rust 1.88+) and breaks the declared 1.85 MSRV.
comfy-table = "=7.2.1"
dm-plugin-sdk = "0.3.0"
rand = "0.8"
pbkdf2 = "0.12"
rpassword = "7.5.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27"
