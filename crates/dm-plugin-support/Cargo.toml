[package]
name = "dm-plugin-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Shared implementation utilities for the built-in dm plugins"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
rand = "0.8"
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"
